<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TB Journal</title>

  <link rel="stylesheet" href="journal.css">
</head>

<body>

<header class="toolbar">

  <div class="title">
    <strong>TB Journal</strong>
    <span>CalDAV VJOURNAL</span>
  </div>

</header>


<main>

  <section class="connection">

    <h2>CalDAV-Verbindung</h2>

    <label>
      CalDAV-URL
      <input
        id="caldavUrl"
        type="url"
value="https://caldav.web.de/begenda/dav/bofhdd@web.de/calendar"
        placeholder="https://server.example/dav/">
    </label>

    <label>
      Benutzername
      <input
        id="caldavUsername"
	value="bofhdd@web.de"
        type="text">
    </label>

    <label>
      Passwort
      <input
        id="caldavPassword"
        type="password">
    </label>

    <div class="connection-actions">

      <div class="action-group">
        <span class="action-group-title">Verbindung</span>

        <button
          id="testConnectionButton"
          type="button">
          Verbindung testen
        </button>

        <button
          id="loadVJournalsButton"
          type="button">
          Alle Journale laden
        </button>

        <button
          id="syncServerToLocalButton"
          type="button">
          Server → Lokal
        </button>

        <button
          id="syncLocalToServerButton"
          type="button">
          Lokal → Server
        </button>
      </div>

      <div class="action-group">
        <span class="action-group-title">Einstellungen</span>

        <button
          id="loadSettingsButton"
          type="button">
          Load Settings
        </button>

        <button
          id="saveSettingsButton"
          type="button">
          Save Settings
        </button>
      </div>

    </div>

    <pre id="connectionResult"></pre>

  </section>




  <div class="actions journal-actions">

    <button
      id="newJournalButton"
      type="button">
      Neues Journal
    </button>

  </div>


  <section class="journal-editor" id="journalEditor" hidden>

    <h2 id="journalEditorHeading">Neues Journal</h2>

    <label>
      Titel
      <input
        id="journalTitle"
        type="text"
        placeholder="Titel des Journals">
    </label>

    <label>
      Datum
      <input
        id="journalDate"
        type="date">
    </label>

    <label>
      Beschreibung
      <textarea
        id="journalDescription"
        rows="6"
        placeholder="Beschreibung"></textarea>
    </label>

    <div class="actions">

      <button
        id="saveJournalButton"
        type="button">
        Speichern
      </button>

      <button
        id="cancelJournalButton"
        type="button">
        Abbrechen
      </button>

    </div>

  </section>


  <section id="journalList">

    <p>Noch keine Journale geladen.</p>

  </section>

</main>


<script type="module" src="journal.js"></script>
<script src="journal-ui.js"></script>

</body>
</html>
